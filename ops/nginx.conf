# /etc/nginx/sites-available/decroche — cf. docs/deployment-runbook.md
server {
    listen 80;
    server_name decroche.example.fr; # ← remplacer par le domaine réel

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name decroche.example.fr; # ← remplacer par le domaine réel

    ssl_certificate     /etc/letsencrypt/live/decroche.example.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/decroche.example.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Webhooks fournisseurs + app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uptime Kuma (profil monitoring), protégé par le même hôte
    location /kuma/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 2m;
}
